version: "3.8"

services:
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: root_dev_2026
      MYSQL_DATABASE: tradingcs
      MYSQL_USER: tradingcs
      MYSQL_PASSWORD: tradingcs_dev_2026
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      retries: 5

  api:
    build:
      context: ./nest
      dockerfile: Dockerfile
    ports:
      - "3201:3201"
    env_file:
      - ./nest/.env.docker
    depends_on:
      mysql:
        condition: service_healthy
    command: >
      sh -c "npx prisma db push && node dist/main.js"

  ui:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VITE_API_URL: http://localhost:3201
    ports:
      - "5173:80"
    depends_on:
      - api

volumes:
  mysql_data:
