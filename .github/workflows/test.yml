# Trading Command Suite — CI Test Workflow
# Runs on push to master and all PRs.
# Validates: install, lint, test, and build for both frontend + backend.
#
# ⚠️ DEPENDENCY INSTALL: uses `npm install` (NOT `npm ci`) on purpose. The
# committed package-lock.json files are generated on Windows and are
# incomplete for Linux CI — Vite 8's Rolldown native bindings depend on
# @emnapi/* (e.g. @emnapi/core@1.11.3) that Windows npm never locks, so
# `npm ci` fails on Linux with EUSAGE. `npm install` tolerates the gap.
# Restore `npm ci` ONLY after regenerating both lockfiles on Linux/WSL/Docker
# (see DEVELOPMENT.md → Common Issues).

name: CI Test

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            nest/package-lock.json

      # ── Frontend (Vite/React) ──
      - name: Install frontend dependencies
        # npm ci fails on Linux: committed lockfile is Windows-generated and
        # lacks the Linux-required @emnapi/* entries (Vite 8 Rolldown native
        # deps). npm install tolerates the gap and resolves per-platform.
        run: npm install

      - name: Lint frontend
        run: npm run lint
        continue-on-error: true

      - name: Build frontend
        run: npm run build

      # ── Backend (NestJS) ──
      - name: Install backend dependencies
        working-directory: ./nest
        # Same cross-platform lockfile reason as frontend — see above.
        run: npm install

      # ⚠️ `nest/package.json`'s `prebuild` also runs three FRONTEND tests
      # (`node --test ../src/core/{notices,score-display,trade-readiness}.test.js`) and those reach
      # `src/core/signal-utils.js`, which does `import { createElement } from 'react'`. The root
      # install above covers that here; the `CI — Build & Lint` workflow's backend job installs
      # root deps for the same reason (measured 2026-10-31: without them, `npm run build` inside
      # `nest/` dies with `ERR_MODULE_NOT_FOUND: Cannot find package 'react'` and every run is red).

      - name: Generate Prisma client
        working-directory: ./nest
        run: npx prisma generate

      - name: Lint backend
        working-directory: ./nest
        run: npm run lint
        continue-on-error: true

      - name: Run backend unit tests
        working-directory: ./nest
        run: npm run test

      - name: Build backend
        working-directory: ./nest
        run: npm run build
