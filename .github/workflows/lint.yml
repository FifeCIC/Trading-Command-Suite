# Trading Command Suite — Lint Workflow
# Runs ESLint checks on PRs and reports results.
#
# ⚠️ DEPENDENCY INSTALL: uses `npm install` (NOT `npm ci`) on purpose — the
# committed lockfiles are Windows-generated and incomplete for Linux CI
# (@emnapi/* gap from Vite 8 Rolldown bindings). `npm install` tolerates it.
# Restore `npm ci` ONLY after regenerating both lockfiles on Linux/WSL/Docker.

name: Lint Check

on:
  pull_request:
    branches: [master]

jobs:
  lint:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'
          cache-dependency-path: |
            package-lock.json
            nest/package-lock.json

      # ── Frontend lint ──
      - name: Install frontend dependencies
        # npm ci fails on Linux (Windows-generated lock missing @emnapi/*).
        run: npm install

      - name: ESLint frontend
        run: npm run lint
        continue-on-error: false

      # ── Backend lint ──
      - name: Install backend dependencies
        working-directory: ./nest
        # npm install — lock is Windows-generated; npm ci fails cross-platform.
        run: npm install

      - name: Generate Prisma client
        working-directory: ./nest
        run: npx prisma generate

      - name: ESLint backend
        working-directory: ./nest
        run: npm run lint
        continue-on-error: false
