# ⚠️ DEPENDENCY INSTALL: uses `npm install` (NOT `npm ci`) on purpose — the
# committed lockfiles are Windows-generated and incomplete for Linux CI
# (@emnapi/* gap from Vite 8 Rolldown bindings). `npm install` tolerates it.
# Restore `npm ci` ONLY after regenerating both lockfiles on Linux/WSL/Docker
# (see DEVELOPMENT.md → Common Issues).

name: CI — Build & Lint

on:
  push:
    branches: [master, main]
  pull_request:
    branches: [master, main]
  workflow_dispatch:

jobs:
  frontend:
    name: Frontend (Vite)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: .
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install  # npm ci fails on Linux — Windows lock missing @emnapi/*
      - run: npm run lint --if-present || true
      - run: npm run build

  backend:
    name: Backend (NestJS)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: ./nest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: nest/package-lock.json
      # ⚠️ THE ROOT DEPENDENCIES ARE INSTALLED FOR THE **BACKEND** JOB, AND THE BUILD FAILS
      # WITHOUT THEM (measured 2026-10-31 from run 41157996537).
      #
      # `nest/package.json`'s `prebuild` runs three FRONTEND tests:
      #     node --test ../src/core/notices/notices.test.js
      #     node --test ../src/core/score-display.test.js
      #     node --test ../src/core/trade-readiness.test.js
      # and `src/core/signal-utils.js` (reached from those) does `import { createElement } from
      # 'react'`. With only `./nest` installed, node resolves from `src/core/` upward, finds no
      # `react` anywhere, and dies with
      #     Error [ERR_MODULE_NOT_FOUND]: Cannot find package 'react'
      # so `npm run build` exited 1 and EVERY CI run on master was red — while the identical build
      # passed locally, because a developer machine has `node_modules/react` at the repo root.
      #
      # Locally it looks like a green gate. In CI it was a red one, which is the same defect with
      # the opposite sign: a build that reports a failure unrelated to the change.
      - name: Install ROOT dependencies (needed by the backend prebuild's frontend guards)
        working-directory: .
        run: npm install  # npm ci fails on Linux — Windows lock missing @emnapi/*
      - run: npm install  # npm ci fails on Linux — Windows lock missing @emnapi/*
      - run: npx prisma generate
      - run: npm run lint --if-present || true
      - run: npm run build
      - name: Directive honesty guard
        run: node scripts/directive-guard.cjs --static-only
